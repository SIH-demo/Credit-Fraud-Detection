
services:

  mysql:
    image: mysql:8.0-oracle
    container_name: cfd-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: fraud_detection
      MYSQL_USER: cfd_user
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password

    secrets:
      - mysql_app_password
      - mysql_root_password

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - cfd-network

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot --password="$$(cat /run/secrets/mysql_root_password)"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ml:
    build:
      context: ..
      dockerfile: infra/docker/ml.Dockerfile

    image: cfd-ml:v1
    container_name: cfd-ml
    restart: unless-stopped

    expose:
      - "8000"

    networks:
      - cfd-network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  analytics:
    build:
      context: ..
      dockerfile: infra/docker/analytics.Dockerfile

    image: cfd-analytics:v1
    container_name: cfd-analytics
    restart: unless-stopped

    expose:
      - "8001"

    networks:
      - cfd-network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile

    image: cfd-backend:v1
    container_name: cfd-backend
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/fraud_detection
      DB_USERNAME: cfd_user
      ML_SERVICE_URL: http://ml:8000
      ANALYTICS_SERVICE_URL: http://analytics:8001
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"

    secrets:
      - mysql_app_password
      - smtp_username
      - smtp_app_password

    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'export DB_PASSWORD="$$(cat /run/secrets/mysql_app_password)" && export SPRING_MAIL_USERNAME="$$(cat /run/secrets/smtp_username)" && export SPRING_MAIL_PASSWORD="$$(cat /run/secrets/smtp_app_password)" && exec java -jar app.jar'

    depends_on:
      mysql:
        condition: service_healthy
      ml:
        condition: service_healthy
      analytics:
        condition: service_healthy

    networks:
      - cfd-network

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile

    image: cfd-frontend:v1
    container_name: cfd-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - cfd-network

networks:
  cfd-network:
    driver: bridge

volumes:
  mysql-data:

secrets:
  mysql_app_password:
    file: ./docker/secrets/mysql_app_password.txt

  mysql_root_password:
    file: ./docker/secrets/mysql_root_password.txt

  smtp_username:
    file: ./docker/secrets/smtp_username.txt

  smtp_app_password:
    file: ./docker/secrets/smtp_app_password.txt
