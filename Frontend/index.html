
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="CreditGuard - Credit Card Fraud Detection System">
    <meta name="theme-color" content="#0f172a">

    <title>CreditGuard | Fraud Detection System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            color: #0f172a;
            font-family: Arial, sans-serif;
        }

        .loading-container {
            text-align: center;
            padding: 30px;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
        }

        .loader {
            width: 38px;
            height: 38px;
            margin: 25px auto 0;
            border: 4px solid #dbeafe;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            color: #dc2626;
            margin-top: 20px;
            font-size: 14px;
        }

        .retry-button {
            margin-top: 15px;
            padding: 10px 18px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <main class="loading-container">
        <div class="logo">CreditGuard</div>

        <p class="subtitle">
            Credit Card Fraud Detection System
        </p>

        <div class="loader" id="loader"></div>

        <p class="subtitle" id="statusMessage">
            Initializing application...
        </p>

        <div id="errorMessage" class="error" hidden>
            Unable to open the application.
            <br>
            Please try again.
        </div>

        <button
            type="button"
            class="retry-button"
            id="retryButton"
            hidden
            onclick="window.location.reload()"
        >
            Retry
        </button>
    </main>

    <script src="shared/js/api.js"></script>
    <script src="shared/js/session.js"></script>

    <script>
        (function () {
            "use strict";

            const DASHBOARD_URL = "dashboard/dashboard.html";
            const LOGIN_URL = "auth/login.html";

            const statusMessage =
                document.getElementById("statusMessage");

            const loader =
                document.getElementById("loader");

            const errorMessage =
                document.getElementById("errorMessage");

            const retryButton =
                document.getElementById("retryButton");

            function showError() {
                loader.hidden = true;
                statusMessage.hidden = true;
                errorMessage.hidden = false;
                retryButton.hidden = false;
            }

            function initializeApp() {
                try {
                    if (!window.CreditGuardSession) {
                        throw new Error("Session module not loaded.");
                    }

                    statusMessage.textContent =
                        "Checking your session...";

                    const user =
                        window.CreditGuardSession.getUser();

                    if (user) {
                        statusMessage.textContent =
                            "Opening your dashboard...";

                        window.location.replace(DASHBOARD_URL);
                    } else {
                        statusMessage.textContent =
                            "Redirecting to login...";

                        window.location.replace(LOGIN_URL);
                    }

                } catch (error) {
                    console.error(
                        "CreditGuard initialization error:",
                        error
                    );

                    showError();
                }
            }

            initializeApp();
        })();
    </script>

</body>
</html>
