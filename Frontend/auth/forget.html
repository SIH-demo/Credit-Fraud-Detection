
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CreditGuard</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-container">
        <div class="auth-card">

            <div class="logo">
                🛡️ CreditGuard
            </div>

            <h2>Forgot Password?</h2>

            <p class="auth-description">
                Enter your registered email address.
                We will send you a verification code to reset your password.
            </p>

            <!-- Step 1: Request OTP -->
            <form id="forgotForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required
                    >
                </div>

                <button type="submit" class="auth-btn" id="sendOtpButton">
                    Send Reset Code
                </button>

            </form>

            <!-- Step 2: Verify OTP and reset password -->
            <form id="resetForm" hidden>

                <div class="form-group">
                    <label for="otp">Verification Code</label>

                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        placeholder="Enter 6-digit OTP"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        minlength="6"
                        maxlength="6"
                        autocomplete="one-time-code"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>

                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        placeholder="Enter new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="auth-btn" id="resetButton">
                    Reset Password
                </button>

            </form>

            <div id="message" class="auth-message" role="status"></div>

            <div class="auth-footer">
                Remember your password?
                <a href="login.html">Back to Login</a>
            </div>

        </div>
    </div>

    <script src="../shared/js/api.js"></script>

    <script>
        const forgotForm = document.getElementById("forgotForm");
        const resetForm = document.getElementById("resetForm");

        const message = document.getElementById("message");

        const sendOtpButton = document.getElementById("sendOtpButton");
        const resetButton = document.getElementById("resetButton");

        let resetEmail = "";

        function showMessage(text, success = false) {
            message.textContent = text;
            message.style.display = "block";
            message.style.color = success ? "#16a34a" : "#dc2626";
        }

        // Step 1: Request password reset OTP
        forgotForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            resetEmail = document.getElementById("email").value.trim();

            sendOtpButton.disabled = true;
            sendOtpButton.textContent = "Sending...";

            message.style.display = "none";

            try {
                const data = await CreditGuardAPI.post(
                    "auth/forgot-password",
                    { email: resetEmail }
                );

                showMessage(
                    data.message ||
                    "If an account exists with this email, a reset code will be sent.",
                    true
                );

                forgotForm.hidden = true;
                resetForm.hidden = false;

            } catch (error) {
                showMessage(
                    error.message ||
                    "Unable to process your request. Please try again."
                );
            } finally {
                sendOtpButton.disabled = false;
                sendOtpButton.textContent = "Send Reset Code";
            }
        });

        // Step 2: Verify OTP and reset password
        resetForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const otp = document.getElementById("otp").value.trim();
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (!/^[0-9]{6}$/.test(otp)) {
                showMessage("Please enter a valid 6-digit OTP.");
                return;
            }

            if (newPassword.length < 8) {
                showMessage("Password must contain at least 8 characters.");
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage("Passwords do not match.");
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = "Resetting...";

            message.style.display = "none";

            try {
                const data = await CreditGuardAPI.post(
                    "auth/reset-password",
                    {
                        email: resetEmail,
                        otp,
                        newPassword
                    }
                );

                showMessage(
                    data.message || "Password reset successfully. Please login.",
                    true
                );

                resetForm.hidden = true;

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1800);

            } catch (error) {
                showMessage(
                    error.message ||
                    "Password reset failed. Please try again."
                );
            } finally {
                resetButton.disabled = false;
                resetButton.textContent = "Reset Password";
            }
        });
    </script>

</body>
</html>
