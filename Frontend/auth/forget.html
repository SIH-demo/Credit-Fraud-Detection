
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CreditGuard</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                🛡️ CreditGuard
            </div>

            <h2>Forgot Password?</h2>

            <p class="auth-description">
                Enter your registered email address.
                We will send you instructions to reset your password.
            </p>

            <form id="forgotForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required
                    >
                </div>

                <button type="submit" class="auth-btn">
                    Send Reset Instructions
                </button>

            </form>

            <div id="message" class="auth-message" role="status"></div>

            <div class="auth-footer">
                Remember your password?
                <a href="login.html">Back to Login</a>
            </div>

        </div>

    </div>

    <script>
        const forgotForm = document.getElementById("forgotForm");
        const message = document.getElementById("message");

        forgotForm.addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();

            message.textContent = "";
            message.style.display = "none";

            try {
                const response = await fetch("/api/v1/auth/forgot-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email: email })
                });

                if (!response.ok) {
                    throw new Error("Unable to process password reset request.");
                }

                message.textContent =
                    "If an account exists with this email, reset instructions will be sent.";

                message.style.display = "block";

                forgotForm.reset();

            } catch (error) {
                message.textContent =
                    "Password reset service is currently unavailable. Please try again later.";

                message.style.display = "block";
            }
        });
    </script>

</body>
</html>
