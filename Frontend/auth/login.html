
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CreditGuard</title>

    <link rel="stylesheet" href="auth.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #1e40af;
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            color: #172554;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #2563eb;
            cursor: pointer;
            font-size: 12px;
        }

        .forgot-password {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 22px;
        }

        .forgot-password a,
        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            margin-top: 18px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #64748b;
        }

        .security-note {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 11px;
        }

        @media(max-width: 480px) {
            .login-container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">🛡️ CreditGuard</div>

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Login to your CreditGuard account
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                    >
                        Show
                    </button>

                </div>

            </div>

            <div class="forgot-password">

                <a href="forget.html">
                    Forgot Password?
                </a>

            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Login
            </button>

            <div id="message" class="message" role="alert"></div>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Register Now</a>
        </div>

        <div class="security-note">
            🔒 Secure CreditGuard Authentication
        </div>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const loginBtn = document.getElementById("loginBtn");
        const message = document.getElementById("message");

        // Show / Hide Password
        togglePassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                togglePassword.textContent = "Hide";
            } else {
                passwordInput.type = "password";
                togglePassword.textContent = "Show";
            }

        });

        // Login API Integration
        loginForm.addEventListener("submit", async function (e) {

            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = passwordInput.value;

            message.style.display = "none";
            message.className = "message";

            loginBtn.disabled = true;
            loginBtn.textContent = "Logging in...";

            try {

                const response = await fetch("/api/v1/auth/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })

                });

                if (!response.ok) {
                    throw new Error("Invalid email or password.");
                }

                // Continue according to the backend
                // authentication and session response.

                window.location.href = "../dashboard/dashboard.html";

            } catch (error) {

                message.textContent =
                    error.message || "Unable to login. Please try again.";

                message.classList.add("error");

                loginBtn.disabled = false;
                loginBtn.textContent = "Login";

            }

        });
    </script>

</body>
</html>
