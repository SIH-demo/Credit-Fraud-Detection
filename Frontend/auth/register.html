<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CreditGuard</title>

    <link rel="stylesheet" href="auth.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            color: #173b68;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
            font-size: 14px;
        }

        h2 {
            color: #172b4d;
            margin-bottom: 22px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 14px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">CreditGuard</div>
        <p class="subtitle">Credit Card Fraud Detection System</p>

        <h2>Create Account</h2>

        <form id="registerForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    required
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" id="registerButton">
                Create Account
            </button>

            <p class="message" id="message"></p>

        </form>


<form id="otpForm" hidden>

    <div class="form-group">
        <label for="otp">Email Verification Code</label>
        <input
            type="text"
            id="otp"
            name="otp"
            placeholder="Enter 6-digit OTP"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            minlength="6"
            required
            autocomplete="one-time-code"
        >
    </div>

    <button type="submit" id="verifyOtpButton">
        Verify Email
    </button>

    <p class="message" id="otpMessage"></p>

</form>


        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

    <script src="../shared/js/api.js"></script>
   <script>
const registerForm = document.getElementById("registerForm");
const otpForm = document.getElementById("otpForm");

const message = document.getElementById("message");
const otpMessage = document.getElementById("otpMessage");

const registerButton = document.getElementById("registerButton");
const verifyOtpButton = document.getElementById("verifyOtpButton");

let registeredEmail = "";

function showMessage(element, text, success = false) {
    element.style.display = "block";
    element.style.color = success ? "#16a34a" : "#dc2626";
    element.textContent = text;
}

// Registration
registerForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password.length < 8) {
        showMessage(message, "Password must contain at least 8 characters.");
        return;
    }

    if (password !== confirmPassword) {
        showMessage(message, "Passwords do not match.");
        return;
    }

    registerButton.disabled = true;
    registerButton.textContent = "Creating Account...";

    try {
        const data = await CreditGuardAPI.post("auth/register", {
            fullName,
            email,
            password
        });

        registeredEmail = email;

        showMessage(
            message,
            data.message || "OTP sent. Please check your email.",
            true
        );

        registerForm.hidden = true;
        otpForm.hidden = false;

    } catch (error) {
        showMessage(message, error.message || "Registration failed.");
    } finally {
        registerButton.disabled = false;
        registerButton.textContent = "Create Account";
    }
});

// OTP verification
otpForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    const otp = document.getElementById("otp").value.trim();

    if (!/^[0-9]{6}$/.test(otp)) {
        showMessage(otpMessage, "Please enter a valid 6-digit OTP.");
        return;
    }

    verifyOtpButton.disabled = true;
    verifyOtpButton.textContent = "Verifying...";

    try {
        const data = await CreditGuardAPI.post("auth/verify-otp", {
            email: registeredEmail,
            otp
        });

        showMessage(
            otpMessage,
            data.message || "Email verified successfully.",
            true
        );

        otpForm.hidden = true;

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);

    } catch (error) {
        showMessage(
            otpMessage,
            error.message || "OTP verification failed."
        );
    } finally {
        verifyOtpButton.disabled = false;
        verifyOtpButton.textContent = "Verify Email";
    }
});
</script>

</body>
</html>
