
spring.application.name=credit-fraud-detection-backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fraud_detection}
spring.datasource.username=${DB_USERNAME:cfd_user}
spring.datasource.password=${DB_PASSWORD:local_dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
