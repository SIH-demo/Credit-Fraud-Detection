
spring.application.name=credit-fraud-detection-backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fraud_detection}
spring.datasource.username=${DB_USERNAME:cfd_user}
spring.datasource.password=${DB_PASSWORD:local_dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=false
spring.jpa.open-in-view=false

ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
analytics.service.url=${ANALYTICS_SERVICE_URL:http://localhost:8001}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email / SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
